<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture Packets</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        form {
            margin-bottom: 20px;
        }
        .packet {
            background-color: #333;
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 10px;
        }
        .packet h4 {
            margin-top: 0;
            color: #00ff00;
        }
        .packet p, .packet pre {
            color: #ffffff;
        }
        .packet pre {
            white-space: pre-wrap;
        }
        label {
            color: #ffffff;
            font-weight: bold;
        }
        input[type=text], input[type=number], button {
            background-color: #333;
            color: #ffffff;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 10px;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Capture Packets</h1>
    <div style="margin-bottom: 20px;">
        <a href="/" style="color: #00ff00; text-decoration: none; font-weight: bold; font-size: 14px;">&larr; Back to Network Scanner</a>
    </div>

    <form id="captureForm" onsubmit="startCapture(event)">
        <label for="interface">Network Interface</label><br>
        <input type="text" id="interface" name="interface" value="Wi-Fi" placeholder="Wi-Fi" required><br><br>

        <label for="start_ip">Start IP Address</label><br>
        <input type="text" id="start_ip" name="start_ip" value="192.168.0.1" placeholder="192.168.0.1" required><br><br>

        <label for="end_ip">End IP Address</label><br>
        <input type="text" id="end_ip" name="end_ip" value="192.168.0.254" placeholder="192.168.0.254" required><br><br>

        <label for="count">Number of Packets to Capture</label><br>
        <input type="number" id="count" name="count" value="10" placeholder="10" required><br><br>

        <button type="submit" id="startBtn">Start Capture</button>
        <button type="button" onclick="loadPackets()" style="margin-left: 10px;">Refresh List</button>
        <span id="status-msg" style="margin-left: 15px; color: #00ff00;"></span>
    </form>

    <div id="packet-list">
        {% if packets %}
            {% for packet in packets %}
                <div class="packet">
                    <h4>IP Packet: {{ packet.src_ip }} &rarr; {{ packet.dst_ip }}</h4>
                    <p><strong>Summary:</strong> {{ packet.summary }}</p>
                    <pre><strong>Details:</strong><br>{{ packet.details }}</pre>
                </div>
            {% endfor %}
        {% else %}
            <p id="empty-msg">No packets captured yet.</p>
        {% endif %}
    </div>

    <script>
        let pollTimer = null;

        function startCapture(event) {
            event.preventDefault();
            const btn = document.getElementById('startBtn');
            const status = document.getElementById('status-msg');
            btn.disabled = true;
            status.textContent = '⏳ Sniffing packets in background...';

            const formData = new FormData(document.getElementById('captureForm'));

            fetch('/start_capture', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                status.textContent = '📡 Capture active. Polling incoming packets...';
                // Poll /packets every 2 seconds for 12 seconds
                let checks = 0;
                clearInterval(pollTimer);
                pollTimer = setInterval(() => {
                    loadPackets();
                    checks++;
                    if (checks >= 8) {
                        clearInterval(pollTimer);
                        btn.disabled = false;
                        status.textContent = '✅ Capture finished (or timed out).';
                    }
                }, 2000);
            })
            .catch(error => {
                console.error('Error:', error);
                status.textContent = '❌ Failed to start capture.';
                btn.disabled = false;
            });
        }

        function loadPackets() {
            fetch('/packets')
                .then(r => r.json())
                .then(data => {
                    const list = document.getElementById('packet-list');
                    if (!data.packets || data.packets.length === 0) {
                        return;
                    }
                    list.innerHTML = '';
                    data.packets.forEach(packet => {
                        const div = document.createElement('div');
                        div.className = 'packet';
                        div.innerHTML = `
                            <h4>IP Packet: ${packet.src_ip} &rarr; ${packet.dst_ip}</h4>
                            <p><strong>Summary:</strong> ${packet.summary}</p>
                            <pre><strong>Details:</strong><br>${packet.details}</pre>
                        `;
                        list.appendChild(div);
                    });
                })
                .catch(err => console.error('Fetch error:', err));
        }
    </script>
</body>
</html>
